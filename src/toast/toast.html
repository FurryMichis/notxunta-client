<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <div class="ico" id="ico"></div>
    <div class="txt"><b id="title"></b><span id="body"></span><small id="hint"></small></div>
    <button class="x" id="x" aria-label="Cerrar">×</button>
  </div>
  <script src="toast.js"></script>
</body>
</html>
